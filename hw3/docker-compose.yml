services:
  # ──────────────── Databases ────────────────

  flight-db:
    image: postgres:15
    environment:
      POSTGRES_DB: flight_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  booking-db:
    image: postgres:15
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ──────────────── Redis Sentinel cluster ────────────────

  redis-master:
    image: redis:7
    command: redis-server --protected-mode no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis-replica:
    image: redis:7
    command: redis-server --replicaof redis-master 6379 --protected-mode no
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-1:
    build: ./redis-sentinel
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis-sentinel-2:
    build: ./redis-sentinel
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started

  redis-sentinel-3:
    build: ./redis-sentinel
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started

  # ──────────────── Application services ────────────────

  flight-service:
    build:
      context: .
      dockerfile: flight_service/Dockerfile
    depends_on:
      flight-db:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
    environment:
      DB_HOST: flight-db
      DB_PORT: "5432"
      DB_NAME: flight_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_SENTINEL_HOSTS: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379"
      REDIS_MASTER_NAME: mymaster
      REDIS_TTL: "300"
      GRPC_PORT: "50051"
      GRPC_AUTH_KEY: "super-secret-api-key-2026"
    expose:
      - "50051"

  booking-service:
    build:
      context: .
      dockerfile: booking_service/Dockerfile
    depends_on:
      booking-db:
        condition: service_healthy
      flight-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_HOST: booking-db
      DB_PORT: "5432"
      DB_NAME: booking_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      FLIGHT_SERVICE_HOST: "flight-service:50051"
      GRPC_AUTH_KEY: "super-secret-api-key-2026"
      CB_FAILURE_THRESHOLD: "5"
      CB_RECOVERY_TIMEOUT: "30"

volumes:
  flight-db-data:
  booking-db-data:
